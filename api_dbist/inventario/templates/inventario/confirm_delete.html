{% extends 'inventario/base.html' %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">{{ titulo }}</h2>
  <a href="{{ back_url }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Volver
  </a>
</div>

<div class="card shadow-sm border-danger" style="max-width: 500px;">
  <div class="card-body p-4 text-center">
    <div class="fs-1 text-danger mb-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
    <h5 class="card-title">¿Confirmar eliminación?</h5>
    <p class="card-text text-muted mb-1">Vas a eliminar el registro:</p>
    <p class="fw-bold fs-5">{{ object }}</p>
    <p class="text-danger small">Esta acción no se puede deshacer.</p>

    <form method="post" class="mt-3">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-3">
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-trash-fill me-1"></i> Sí, eliminar
        </button>
        <a href="{{ back_url }}" class="btn btn-outline-secondary px-4">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
