<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DBIST{% endblock %} | DBIST Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .sidebar {
      min-height: 100vh;
      background: #1a1d21;
      position: sticky;
      top: 0;
    }
    .sidebar-brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      padding: 1.25rem 1rem;
      border-bottom: 1px solid #2d3135;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .sidebar .nav-link {
      color: #9ea3a8;
      padding: .45rem 1rem;
      border-radius: .375rem;
      margin: .1rem .5rem;
      font-size: .9rem;
    }
    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      color: #ffffff;
      background: #2d3135;
    }
    .sidebar .nav-link i { margin-right: .5rem; }
    .sidebar-section {
      color: #5c6370;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      padding: .75rem 1.5rem .25rem;
    }
    .main-content { padding: 2rem 2.5rem; }
    .card { border: none; border-radius: .75rem; }
    .card-header { border-radius: .75rem .75rem 0 0 !important; }
  </style>
</head>
<body>
<div class="container-fluid g-0">
  <div class="row g-0">

    <!-- Sidebar -->
    <nav class="col-auto sidebar d-flex flex-column py-0" style="width:220px;">
      <div class="sidebar-brand">
        <i class="bi bi-box-seam-fill text-primary"></i> DBIST
      </div>
      <ul class="nav flex-column mt-2 flex-grow-1">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
             href="{% url 'index' %}">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>

        <div class="sidebar-section mt-2">Inventario</div>
        <li class="nav-item">
          <a class="nav-link {% if 'categoria' in request.resolver_match.url_name %}active{% endif %}"
             href="{% url 'categorias' %}">
            <i class="bi bi-tags-fill"></i> Categorías
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'proveedor' in request.resolver_match.url_name %}active{% endif %}"
             href="{% url 'proveedores' %}">
            <i class="bi bi-truck-front-fill"></i> Proveedores
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'producto' in request.resolver_match.url_name %}active{% endif %}"
             href="{% url 'productos' %}">
            <i class="bi bi-box-fill"></i> Productos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'inventario' in request.resolver_match.url_name %}active{% endif %}"
             href="{% url 'inventarios' %}">
            <i class="bi bi-clipboard2-data-fill"></i> Inventario
          </a>
        </li>

        <div class="sidebar-section mt-2">Ventas</div>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'facturas' or request.resolver_match.url_name == 'factura_crear' or request.resolver_match.url_name == 'factura_editar' or request.resolver_match.url_name == 'factura_eliminar' %}active{% endif %}"
             href="{% url 'facturas' %}">
            <i class="bi bi-receipt-cutoff"></i> Facturas
          </a>
        </li>

        <div class="sidebar-section mt-2">Sistema</div>
        <li class="nav-item">
          <a class="nav-link {% if 'usuario' in request.resolver_match.url_name %}active{% endif %}"
             href="{% url 'usuarios' %}">
            <i class="bi bi-people-fill"></i> Usuarios
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'admin:index' %}">
            <i class="bi bi-shield-lock-fill"></i> Admin
          </a>
        </li>
      </ul>
      <div class="text-center pb-3" style="color:#3d4147; font-size:.75rem;">
        DBIST &copy; 2026
      </div>
    </nav>

    <!-- Contenido principal -->
    <main class="col main-content">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </main>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
